<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>АукционСотика — Главная</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        html, body {
          height: 100%;
          overflow: hidden;
          background: #020617;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: #e5e7eb;
        }

        .auction-section {
          display: grid;
          grid-template-columns: 1fr;
          gap: 12px;
          height: 100vh;
          padding: 10px;
          background: #020617;
          align-items: start;
        }

        .auction-frame {
          border: 1px solid rgba(148,163,184,0.4);
          border-radius: 16px;
          background: #0f172a;
          box-shadow: 0 20px 60px rgba(0,0,0,0.8);
          overflow: hidden;
          display: flex;
          flex-direction: column;
          height: 100%;
        }

        .auction-header {
          padding: 8px 12px;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          border-bottom: 1px solid rgba(148,163,184,0.4);
          background: rgba(15,23,42,0.96);
        }

        .auction-body {
          flex: 1;
          overflow-y: auto;
          padding: 12px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .auction-item {
          padding: 10px;
          border-radius: 10px;
          background: rgba(15,23,42,0.9);
          border: 1px solid rgba(148,163,184,0.5);
          font-size: 13px;
          color: #e5e7eb;
        }

        .auction-item-title {
          font-weight: 700;
          margin-bottom: 6px;
        }

        .auction-item-desc {
          font-size: 12px;
          color: #9ca3af;
          margin-bottom: 6px;
        }

        .auction-item-bid {
          font-size: 12px;
          color: #facc15;
        }
    </style>
</head>
<body>
<section class="auction-section">
    <div class="auction-frame">
        <div class="auction-header">АукционСотика</div>
        <div class="auction-body" id="auction-body">
            <!-- Содержимое будет добавлено через JavaScript -->
        </div>
    </div>
</section>

<script>
    const auctionBody = document.getElementById("auction-body");

    function addAuctionItem(title, desc, bid) {
      const item = document.createElement("div");
      item.className = "auction-item";

      const titleEl = document.createElement("div");
      titleEl.className = "auction-item-title";
      titleEl.textContent = title;

      const descEl = document.createElement("div");
      descEl.className = "auction-item-desc";
      descEl.textContent = desc;

      const bidEl = document.createElement("div");
      bidEl.className = "auction-item-bid";
      bidEl.textContent = `Текущая ставка: ${bid}₽`;

      item.appendChild(titleEl);
      item.appendChild(descEl);
      item.appendChild(bidEl);
      auctionBody.appendChild(item);
    }

    // Примеры лотов
    addAuctionItem("Редкий мерч", "Эксклюзивная футболка с автографом", 1500);
    addAuctionItem("Вечный VIP", "VIP-статус в чате навсегда", 5000);
    addAuctionItem("Стрим по запросу", "Стрим игры по вашему выбору", 3000);
</script>
</body>
</html>
