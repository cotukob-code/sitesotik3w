<svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="50%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Рамка карточки -->
    <rect x="12" y="12" width="316" height="196" rx="24"
          fill="none"
          stroke="url(#neon)" stroke-width="3"
          filter="url(#glow)"/>

    <!-- ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШ ФАЙЛ -->
    <svg x="30" y="25" width="90" height="60" viewBox="0 0 200 140">
        <!-- Нижняя часть -->
        <rect x="10" y="100" width="180" height="20" rx="4" fill="#1f2937"/>
        <rect x="20" y="105" width="160" height="10" rx="3" fill="#374151"/>

        <!-- Корпус -->
        <rect x="10" y="10" width="180" height="100" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="2"/>

        <!-- Экран -->
        <rect x="20" y="20" width="160" height="70" rx="4" fill="#0f172a"/>
        <rect x="20" y="20" width="160" height="70" rx="4" fill="rgba(255,255,255,0.05)"/>

        <!-- Блик -->
        <path d="M20 20 L180 20 L180 55 Z" fill="rgba(255,255,255,0.08)"/>

        <!-- Камера -->
        <circle cx="100" cy="25" r="3" fill="#1f2937" stroke="#3b82f6" stroke-width="1"/>
    </svg>


    <!-- Заголовок -->
    <text x="120" y="60" font-size="24" font-weight="bold"
          fill="url(#neon)" text-anchor="start"
          filter="url(#glow)">
        СайтСотика
    </text>

    <!-- Подзаголовок -->
    <text x="120" y="95" font-size="16"
          fill="#e0e0e0" text-anchor="start">
        Сайт стримера с инв 1 гр.
    </text>

    <!-- Кнопка -->
    <g transform="translate(50,130)">
        <rect x="0" y="0" width="240" height="40" rx="8"
              fill="url(#neon)"
              filter="url(#glow)"/>
        <text x="120" y="28" font-size="18" font-weight="bold"
              fill="#111827" text-anchor="middle">
            Войти на сайт
        </text>

    </g>
</svg>