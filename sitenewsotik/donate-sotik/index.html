<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ДонатыСотика — Отправь донат</title>
  <style>
    /* === Глобальные стили === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070b;
      color: #f5f5f5;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
    }

    .window {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: #0b0f18;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .content {
      flex: 1;
      border-radius: 16px;
      border: 1px solid #222836;
      background: #090d14;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.8);
      padding: 32px;
      box-sizing: border-box;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* === Форма доната === */
    .donate-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
    }

    input, button {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #2d3748;
      background: #1a1f2b;
      color: #f5f5f5;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    input:hover {
      background: #1e2430;
    }

    button {
      background: #3b82f6;
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    /* === Список сервисов и банков === */
    .services-grid, .banks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .service-option, .bank-option {
      padding: 12px;
      background: #1a1f2b;
      border: 1px solid #2d3748;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .service-option:hover, .bank-option:hover {
      background: #2563eb;
      border-color: #3b82f6;
    }

    .service-option.selected, .bank-option.selected {
      background: #3b82f6;
      border-color: #1d4ed8;
      color: white;
      font-weight: 600;
    }

    /* === Уведомление === */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #10b981;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      transform: translateX(200%);
      transition: transform 0.4s ease-out;
    }

    .notification.show {
      transform: translateX(0);
    }

    /* === История донатов === */
    .history {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #222836;
      font-size: 14px;
    }

    .history h3 {
      color: #e2e8f0;
      margin-bottom: 10px;
    }

    .history-item {
      background: #1a1f2b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border-left: 4px solid #3b82f6;
    }

    /* === Анимация загрузки === */
    .loading {
      display: none;
      justify-content: center;
      align-items: center;
      height: 60px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #2d3748;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* === Адаптивность === */
    @media (max-width: 768px) {
      .window {
        padding: 20px;
        border-radius: 16px;
      }
      h1 {
        font-size: 28px;
      }
      .content {
        padding: 20px;
      }
      .services-grid, .banks-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .services-grid, .banks-grid {
        grid-template-columns: 1fr;
      }
      input, button {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Уведомление -->
  <div id="notification" class="notification">
    Донат отправлен! Спасибо ❤️
  </div>

  <div class="window">
    <h1>ДонатыСотика</h1>
    <div class="content">

      <div class="donate-form">
        <div class="form-group">
          <label>Сумма (₽)</label>
          <input type="number" id="amount" placeholder="Введите сумму" min="1" value="100">
        </div>

        <div class="form-group">
          <label>Банк</label>
          <div class="banks-grid" id="banks">
            <div class="bank-option" data-bank="Сбер">Сбер</div>
            <div class="bank-option" data-bank="Тинькофф">Тинькофф</div>
            <div class="bank-option" data-bank="ВТБ">ВТБ</div>
            <div class="bank-option" data-bank="Альфа">Альфа-Банк</div>
          </div>
        </div>

        <div class="form-group">
          <label>Сервис</label>
          <div class="services-grid" id="services">
            <div class="service-option" data-service="Boosty">Boosty</div>
            <div class="service-option" data-service="DonatePay">DonatePay</div>
            <div class="service-option" data-service="QIWI">QIWI</div>
            <div class="service-option" data-service="ЮMoney">ЮMoney</div>
            <div class="service-option" data-service="PayPal">PayPal</div>
            <div class="service-option" data-service="Ko-fi">Ko-fi</div>
          </div>
        </div>

        <button id="send-donate">Отправить донат</button>

        <div class="loading" id="loading">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- История -->
      <div class="history">
        <h3>История донатов</h3>
        <div id="history-list">
          <!-- Сюда вставим историю -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // === Выбор банка и сервиса ===
    let selectedBank = null;
    let selectedService = null;

    document.querySelectorAll('.bank-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.bank-option').forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        selectedBank = option.dataset.bank;
      });
    });

    document.querySelectorAll('.service-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.service-option').forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        selectedService = option.dataset.service;
      });
    });

    // === Отправка доната ===
    document.getElementById('send-donate').addEventListener('click', () => {
      const amount = document.getElementById('amount').value;

      if (!amount || amount <= 0) {
        alert('Введите корректную сумму!');
        return;
      }
      if (!selectedBank) {
        alert('Выберите банк!');
        return;
      }
      if (!selectedService) {
        alert('Выберите сервис!');
        return;
      }

      const loading = document.getElementById('loading');
      const button = document.getElementById('send-donate');

      // Показываем загрузку
      loading.style.display = 'flex';
      button.disabled = true;
      button.textContent = 'Отправляем...';

      // Имитация отправки (через 1.5 сек)
      setTimeout(() => {
        const donate = {
          amount: amount,
          bank: selectedBank,
          service: selectedService,
          date: new Date().toLocaleString('ru-RU')
        };

        // Сохраняем в localStorage
        const history = JSON.parse(localStorage.getItem('donates') || '[]');
        history.push(donate);
        localStorage.setItem('donates', JSON.stringify(history));

        // Обновляем историю
        renderHistory();

        // Показываем уведомление
        const notif = document.getElementById('notification');
        notif.classList.add('show');
        setTimeout(() => notif.classList.remove('show'), 3000);

        // Сброс
        document.getElementById('amount').value = '100';
        document.querySelectorAll('.bank-option, .service-option').forEach(o => o.classList.remove('selected'));
        selectedBank = null;
        selectedService = null;

        // Скрываем загрузку
        loading.style.display = 'none';
        button.disabled = false;
        button.textContent = 'Отправить донат';
      }, 1500);
    });

    // === Отображение истории ===
    function renderHistory() {
      const list = document.getElementById('history-list');
      const history = JSON.parse(localStorage.getItem('donates') || '[]');

      if (history.length === 0) {
        list.innerHTML = '<div>Пока нет донатов.</div>';
        return;
      }

      list.innerHTML = history.slice(-5).reverse().map(d => `
        <div class="history-item">
          <strong>${d.amount} ₽</strong> через ${d.bank} → ${d.service}<br>
          <small>${d.date}</small>
        </div>
      `).join('');
    }

    // Загружаем историю при старте
    renderHistory();
  </script>
</body>
</html>
