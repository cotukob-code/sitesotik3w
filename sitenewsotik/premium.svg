<svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glass-border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
        </linearGradient>
        <linearGradient id="glass-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
        </linearGradient>
    </defs>

    <rect x="10" y="10" width="320" height="200" rx="26"
          fill="url(#glass-bg)"
          stroke="url(#glass-border)" stroke-width="2"/>
</svg>
