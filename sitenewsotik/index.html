<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<title>СайтыСотика — Хаб</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:'Segoe UI',sans-serif;
      background:#0f172a;
      color:#e5e7eb;
    }

    h1{
      text-align:center;
      margin:40px 0 20px 0;
      font-size:48px;
      font-weight:700;
    }

    .container{
      display:flex;
      justify-content:center;
      gap:40px;
      flex-wrap:wrap;
      margin-top:40px;
    }

    /* ✔ БАЗОВЫЙ РАЗМЕР ДЛЯ ПК */
    .window{
      width:340px;
      height:220px;
      background:#0f172a;
      border-radius:24px;
      border:1px solid rgba(148,163,184,.4);
      box-shadow:0 20px 40px rgba(0,0,0,.6);
      overflow:hidden;
      cursor:pointer;
      transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .window:hover{
      transform:translateY(-6px);
      border-color:#3b82f6;
      box-shadow:0 28px 60px rgba(37,99,235,.7);
    }

    /* ✔ SVG занимает всю карточку */
    .card-svg{
      width:100%;
      height:100%;
      display:block;
    }

    .content{
      padding:20px;
    }

    .title{
      font-size:24px;
      font-weight:600;
      margin-bottom:10px;
    }

    .desc{
      font-size:14px;
      color:#94a3b8;
      line-height:1.4;
    }

    /* 📱 ✔ АДАПТИВ ДЛЯ ТЕЛЕФОНОВ */
    @media (max-width: 480px){
      .container{
        padding: 0 16px;
      }
      .window{
        width:100%;        /* растягивается на всю ширину телефона */
        max-width:100%;    /* заполнение ширины экрана */
        height:300px;      /* увеличена высота для лучшего восприятия на мобильных */
      }
    }
  </style>


</head>

<body>

<h1>СайтыСотика</h1>

<div class='container'>

  <!-- САЙТСОТИКА -->
  <div class='window' data-title='СайтСотика'>
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <rect x="12" y="12" width="316" height="196" rx="24"
            fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>

      <!-- Ноутбук -->
      <svg x="30" y="25" width="90" height="60" viewBox="0 0 200 140">
        <rect x="10" y="100" width="180" height="20" rx="4" fill="#1f2937"/>
        <rect x="20" y="105" width="160" height="10" rx="3" fill="#374151"/>
        <rect x="10" y="10" width="180" height="100" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
        <rect x="20" y="20" width="160" height="70" rx="4" fill="#0f172a"/>
        <rect x="20" y="20" width="160" height="70" rx="4" fill="rgba(255,255,255,0.05)"/>
        <path d="M20 20 L180 20 L180 55 Z" fill="rgba(255,255,255,0.08)"/>
        <circle cx="100" cy="25" r="3" fill="#1f2937" stroke="#3b82f6" stroke-width="1"/>
      </svg>

      <text x="120" y="60" font-size="24" font-weight="bold"
            fill="url(#neon)" filter="url(#glow)">СайтСотика</text>

      <text x="120" y="95" font-size="16" fill="#e0e0e0">Сайт стримера с инв 1 гр.</text>

      <g transform="translate(50,130)">
        <rect width="240" height="40" rx="8" fill="url(#neon)" filter="url(#glow)"/>
        <text x="120" y="28" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Войти на сайт</text>
      </g>
    </svg>
  </div>

  <!-- ДОНАТЫСОТИКА -->
  <div class='window' data-title='ДонатыСотика'>
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="neon-green" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22c55e"/>
          <stop offset="50%" stop-color="#16a34a"/>
          <stop offset="100%" stop-color="#4ade80"/>
        </linearGradient>
        <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <rect x="12" y="12" width="316" height="196" rx="24"
            fill="none" stroke="url(#neon-green)" stroke-width="3" filter="url(#glow-green)"/>

      <!-- Банк -->
      <svg x="30" y="25" width="90" height="70" viewBox="0 0 200 160">
        <rect x="20" y="120" width="160" height="20" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
        <rect x="40" y="60" width="12" height="60" fill="#1f2937" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="70" y="60" width="12" height="60" fill="#1f2937" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="100" y="60" width="12" height="60" fill="#1f2937" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="130" y="60" width="12" height="60" fill="#1f2937" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="160" y="60" width="12" height="60" fill="#1f2937" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="30" y="40" width="140" height="20" rx="4" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
        <polygon points="20,40 180,40 160,20 40,20" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
        <circle cx="100" cy="30" r="8" fill="#22c55e" stroke="#4ade80" stroke-width="2"/>
      </svg>

      <text x="130" y="60" font-size="24" font-weight="bold"
            fill="url(#neon-green)" filter="url(#glow-green)">ДонатыСотика</text>

      <text x="130" y="95" font-size="16" fill="#e0e0e0">Отправь свой ДОНАТ</text>

      <g transform="translate(50,130)">
        <rect width="240" height="40" rx="8" fill="url(#neon-green)" filter="url(#glow-green)"/>
        <text x="120" y="28" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Перейти</text>
      </g>
    </svg>
  </div>

  <!-- АУКЦИОНСОТИКА -->
  <div class='window' data-title='АукционСотика'>
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f97316"/>
          <stop offset="50%" stop-color="#fb923c"/>
          <stop offset="100%" stop-color="#facc15"/>
        </linearGradient>
        <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <rect x="12" y="12" width="316" height="196" rx="24"
            fill="none" stroke="url(#neon-orange)" stroke-width="3" filter="url(#glow-orange)"/>

      <!-- Рулетка -->
      <svg x="30" y="25" width="90" height="70" viewBox="0 0 200 160">
        <ellipse cx="100" cy="125" rx="60" ry="10" fill="rgba(0,0,0,0.5)"/>
        <circle cx="100" cy="80" r="55" fill="#111827" stroke="#f97316" stroke-width="3"/>
        <circle cx="100" cy="80" r="45" fill="#020617" stroke="#facc15" stroke-width="2"/>
        <g>
          <path d="M100 80 L100 35 A45 45 0 0 1 135 48 Z" fill="#ef4444"/>
          <path d="M100 80 L135 48 A45 45 0 0 1 145 80 Z" fill="#22c55e"/>
          <path d="M100 80 L145 80 A45 45 0 0 1 135 112 Z" fill="#eab308"/>
          <path d="M100 80 L135 112 A45 45 0 0 1 100 125 Z" fill="#3b82f6"/>
          <path d="M100 80 L100 125 A45 45 0 0 1 65 112 Z" fill="#ec4899"/>
          <path d="M100 80 L65 112 A45 45 0 0 1 55 80 Z" fill="#22c55e"/>
          <path d="M100 80 L55 80 A45 45 0 0 1 65 48 Z" fill="#f97316"/>
          <path d="M100 80 L65 48 A45 45 0 0 1 100 35 Z" fill="#0ea5e9"/>
        </g>
        <circle cx="100" cy="80" r="16" fill="#020617" stroke="#facc15" stroke-width="2"/>
        <polygon points="100,18 94,30 106,30" fill="#facc15" stroke="#f97316" stroke-width="2"/>
        <circle cx="135" cy="48" r="4" fill="#f9fafb"/>
      </svg>

      <text x="130" y="60" font-size="24" font-weight="bold"
            fill="url(#neon-orange)" filter="url(#glow-orange)">АукционСотика</text>

      <text x="130" y="95" font-size="16" fill="#e0e0e0">Купите Дом Сотика</text>

      <g transform="translate(50,130)">
        <rect width="240" height="40" rx="8" fill="url(#neon-orange)" filter="url(#glow-orange)"/>
        <text x="120" y="28" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Перейти к аукциону</text>
      </g>
    </svg>
  </div>

</div>


<script>
  const windows = document.querySelectorAll('.window');
  windows.forEach(w => {
    w.addEventListener('click', () => {
      const title = w.dataset.title;
      console.log('Открыто окно:', title);

      // Перенаправление для карточки "СайтСотика"
      if (title === 'СайтСотика') {
        window.location.href = 'site-sotik/';
      }
      // Можно добавить другие условия для других карточек позже
    });
  });
</script>

</body>
</html>
