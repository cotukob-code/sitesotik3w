<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>АукционСотика — Окно</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #05070b;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .window {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: #0b0f18;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }
    .content {
      flex: 1;
      border-radius: 16px;
      border: 1px solid #222836;
      background: #090d14;
      box-shadow: 0 18px 50px rgba(0,0,0,0.8);
      padding: 24px;
      box-sizing: border-box;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="window">
    <h1>АукционСотика</h1>
    <div class="content">
      Огромное окно под аукцион: лоты, ставки, цели, привязка к донатам и чату.
    </div>
  </div>
</body>
</html>
