<!DOCTYPE html>
<html lang='ru'>
<head>
  <meta charset='UTF-8' />
  <title>СайтСотика — Хаб</title>
  <meta name='viewport' content='width=device-width, initial-scale=1' />

  <style>
        /* ================== БАЗА ================== */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        html,
        body {
          height: 100%;
        }

        body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
            sans-serif;
          background: radial-gradient(circle at top, #020617 0, #000 60%);
          color: #e5e7eb;
        }

        :root {
          --bg: #020617;
          --bg2: #02081a;
          --border: rgba(148, 163, 184, 0.4);
          --accent-blue: #38bdf8;
          --accent-green: #22c55e;
          --accent-gold: #fbbf24;
          --text-main: #e5e7eb;
          --text-soft: #9ca3af;
          --radius-xl: 24px;
          --radius-lg: 18px;
          --radius-md: 12px;
          --transition-med: 260ms ease-out;
          --transition-slow: 3s ease;
        }

        /* ================== ОБОЛОЧКА ХАБА ================== */
        .hub-shell {
          position: relative;
          z-index: 1;
          min-height: 100vh;
          padding: 20px 24px 24px;
          display: flex;
          flex-direction: column;
          background: radial-gradient(circle at top, #020617 0, #020617 60%, #000);
          transition: opacity 400ms ease, transform 400ms ease;
        }

        .hub-shell--hidden {
          opacity: 0;
          transform: translateY(40px);
          pointer-events: none;
          display: none;
        }

        .hub-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 18px;
        }

        .hub-brand {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .hub-logo {
          width: 38px;
          height: 38px;
          border-radius: 999px;
          background: conic-gradient(
            from 210deg,
            #38bdf8,
            #22c55e,
            #fbbf24,
            #ec4899,
            #38bdf8
          );
          padding: 2px;
          box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
        }

        .hub-logo-inner {
          width: 100%;
          height: 100%;
          border-radius: inherit;
          background: radial-gradient(circle at 30% 20%, #0f172a, #020617 70%);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #e5e7eb;
          font-weight: 800;
          font-size: 18px;
          letter-spacing: 0.08em;
        }

        .hub-brand-text-main {
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
        }

        .hub-brand-text-sub {
          font-size: 10px;
          color: var(--text-soft);
          text-transform: uppercase;
          letter-spacing: 0.18em;
        }

        .hub-brand-stack {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }

        .hub-tag {
          border-radius: 999px;
          padding: 6px 10px;
          border: 1px solid var(--border);
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.16em;
          color: var(--text-soft);
        }

        .hub-center {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 16px;
          min-height: 0;
        }

        .hub-title {
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
        }

        .hub-subtitle {
          margin-top: 4px;
          font-size: 12px;
          color: var(--text-soft);
          max-width: 520px;
        }

        .hub-bottom {
          margin-top: 16px;
          font-size: 10px;
          color: var(--text-soft);
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .hub-bottom-pill {
          border-radius: 999px;
          padding: 3px 8px;
          border: 1px solid var(--border);
          text-transform: uppercase;
          letter-spacing: 0.16em;
        }

        /* ================== ТРИ ОКНА ================== */
        .hub-windows-row {
          flex: 1;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
          min-height: 0;
          margin-top: 10px;
        }

        @media (max-width: 1024px) {
          .hub-windows-row {
            grid-template-columns: minmax(0, 1fr);
          }
        }

        .hub-window { aspect-ratio:16/9;
          position: relative;
          border-radius: var(--radius-xl);
          border: 1px solid var(--border);
          background: radial-gradient(
              circle at top left,
              rgba(56, 189, 248, 0.18),
              transparent 55%
            ),
            #020617;
          padding: 14px 14px 16px;
          display: flex;
          flex-direction: column;
          gap: 8px;
          cursor: pointer;
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
          transition: transform var(--transition-med),
            box-shadow var(--transition-med), border-color var(--transition-med),
            background var(--transition-med);
        }

        .hub-window--site {
          border-color: rgba(56, 189, 248, 0.9);
        }

        .hub-window--donate {
          border-color: rgba(34, 197, 94, 0.9);
          background: radial-gradient(
              circle at top left,
              rgba(34, 197, 94, 0.18),
              transparent 55%
            ),
            #020617;
        }

        .hub-window--auction {
          border-color: rgba(251, 191, 36, 0.9);
          background: radial-gradient(
              circle at top left,
              rgba(251, 191, 36, 0.18),
              transparent 55%
            ),
            #020617;
        }

        .hub-window:hover {
          transform: translateY(-8px);
          box-shadow: 0 32px 80px rgba(0, 0, 0, 0.95);
        }

        .hub-window-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }

        .hub-window-label {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.16em;
          color: var(--text-soft);
        }

        .hub-window-title {
          margin-top: 2px;
          font-size: 16px;
          font-weight: 800;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        .hub-window-title--blue {
          color: var(--accent-blue);
        }

        .hub-window-title--green {
          color: var(--accent-green);
        }

        .hub-window-title--gold {
          color: var(--accent-gold);
        }

        .hub-window-badge {
          border-radius: 999px;
          padding: 4px 9px;
          border: 1px solid var(--border);
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.16em;
          color: var(--text-soft);
        }

        .hub-window-body {
          margin-top: 8px;
          border-radius: var(--radius-lg);
          border: 1px solid rgba(31, 41, 55, 0.9);
          background: #020617;
          padding: 9px 10px 10px;
          font-size: 12px;
          color: var(--text-soft);
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .hub-window-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 6px;
        }

        .hub-window-row-label {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.16em;
          color: var(--text-soft);
        }

        .hub-window-row-value {
          font-size: 12px;
          color: var(--text-main);
        }

        .hub-window-footer {
          margin-top: 8px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 11px;
          color: var(--text-soft);
        }

        .hub-window-arrow {
          font-size: 18px;
          transition: transform 160ms ease-out;
        }

        .hub-window:hover .hub-window-arrow {
          transform: translateX(4px);
        }

        /* ================== САЙТСОТИКА — ПОЛНОЦЕННОЕ ОКНО ================== */
        .sitesotik-app {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          opacity: 0;
          pointer-events: none;
          transform: translateY(40px) scale(0.96);
          transition: opacity var(--transition-slow),
            transform var(--transition-slow);
          background: radial-gradient(circle at top, #020617 0, #000 60%);
          z-index: 10;
        }

        .sitesotik-app--active {
          background: radial-gradient(circle at top, #020617 0, #000 60%);
          opacity: 1;
          pointer-events: auto;
          transform: translateY(0) scale(1);
        }

        /* ===== ХЭДЕР САЙТСОТИКА ===== */
        .sitesotik-header {
          padding: 14px 24px;
          border-bottom: 1px solid var(--border);
          background: rgba(2, 6, 23, 0.96);
          backdrop-filter: blur(16px);
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: relative;
          z-index: 5;
        }

        .sitesotik-back {
          position: absolute;
          left: 24px;
          padding: 7px 14px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: rgba(15, 23, 42, 0.96);
          color: var(--text-main);
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.16em;
          cursor: pointer;
          transition: background 200ms ease, border-color 200ms ease,
            color 200ms ease, box-shadow 200ms ease, transform 120ms ease;
        }

        .sitesotik-back:hover {
          background: rgba(56, 189, 248, 0.18);
          border-color: var(--accent-blue);
          color: var(--accent-blue);
          box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
          transform: translateY(-1px);
        }

        .sitesotik-header-center {
          display: flex;
          align-items: center;
          gap: 10px;
          pointer-events: none;
          margin-left: 110px;
        }

        .sitesotik-header-logo-circle {
          width: 36px;
          height: 36px;
          border-radius: 999px;
          background: conic-gradient(
            from 210deg,
            #38bdf8,
            #22c55e,
            #fbbf24,
            #ec4899,
            #38bdf8
          );
          padding: 2px;
          box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
        }

          background: radial-gradient(circle at 30% 20%, #0f172a, #020617 70%);

          align-items: center;
          justify-content: center;
          color: #e5e7eb;
          font-weight: 800;
          font-size: 16px;
          letter-spacing: 0.08em;
        }

        .sitesotik-header-title {
          font-size: 20px;
          font-weight: 900;
          letter-spacing: 0.18em;
          text-transform: none;
          color: #e5e7eb;
        }

        .sitesotik-nav {
          position: absolute;
          right: 24px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .sitesotik-nav-list {
          display: flex;
          align-items: center;
          gap: 8px;
        }
