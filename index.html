<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат на Supabase</title>
  <meta name="referrer" content="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Инициализация Supabase клиента
    const supabaseUrl = 'https://xdohisilunbnfqbuglwi.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkb2hpc2lsdW5ibmZxYnVnbHdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjQ3MTAsImV4cCI6MjA5NDg0MDcxMH0.vUcvR-YNmO5zwcogUuTxv_GFgpBzVvZvfFypNpu3EZQ';
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
  </script>
  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #chat {
      flex: 1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #1e293b;
    }
    .message {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 6px;
      background: #334155;
      max-width: 80%;
      word-wrap: break-word;
    }
    .username {
      font-weight: bold;
      color: #60a5fa;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input, button {
      padding: 10px;
      border: none;
      border-radius: 6px;
    }
    input {
      flex: 1;
      background: #1e293b;
      color: #e5e7eb;
      border: 1px solid #334155;
    }
    button {
      background: #60a5fa;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #4c9aff;
    }
  </style>
</head>
<body>
  <h2>💬 Чат</h2>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="username" placeholder="Ваше имя" value="Аноним" />
    <input type="text" id="message" placeholder="Введите сообщение..." />
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const messageEl = document.getElementById('message');
    const usernameEl = document.getElementById('username');

    // === Загрузка сообщений ===
    async function loadMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('username, message, inserted_at')
        .order('inserted_at', { ascending: true });

      if (error) {
        console.error('Ошибка загрузки:', error);
        return;
      }

      chatEl.innerHTML = '';
      data.forEach(addMessageToDOM);
    }

    // === Добавление сообщения в DOM ===
    function addMessageToDOM(msg) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <span class="username">${escapeHtml(msg.username)}:</span>
        ${escapeHtml(msg.message)}
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // === Отправка сообщения ===
    async function sendMessage() {
      const username = usernameEl.value.trim() || 'Аноним';
      const text = messageEl.value.trim();
      if (!text) return;

      const { error } = await supabase
        .from('messages')
        .insert([{ username, message: text }]);

      if (error) {
        console.error('Ошибка отправки:', error);
      } else {
        messageEl.value = '';
      }
    }

    // === Подписка на новые сообщения ===
    supabase
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        addMessageToDOM(payload.new);
      })
      .subscribe();

    // === Экранирование HTML для безопасности ===
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // === Загружаем сообщения при старте ===
    loadMessages();
  </script>
</body>
</html>
