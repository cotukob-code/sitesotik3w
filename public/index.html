<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Хаб Сотика</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* ХАБ */
    #hub {
      position: fixed;
      inset: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hub-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }
    .hub-item {
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: .2s;
    }
    .hub-item:hover {
      transform: translateY(-5px);
    }

    /* ЭКРАН САЙТА */
    #site {
      position: fixed;
      inset: 0;
      background: #020617;
      display: none;
      flex-direction: column;
    }
    #site.active {
      display: flex;
    }
    .site-header {
      padding: 12px 20px;
      background: #0f172a;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }
    .site-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 10px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ЧАТ */
    .chat {
      background: #0f172a;
      border: 1px solid #333;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .msg {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .msg .meta {
      font-size: 10px;
      color: #9ca3af;
    }
    .msg .text {
      font-size: 13px;
      color: #e5e7eb;
    }
    #chat-input {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    #chat-msg {
      grid-column: 1/3;
      resize: none;
      height: 40px;
    }
    #chat-send {
      grid-column: 1/3;
      padding: 8px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ХАБ -->
<div id="hub">
  <h1>Хаб Сотика</h1>
  <div class="hub-grid">
    <div class="hub-item" id="open-site">Сайт</div>
    <div class="hub-item" id="open-donate">Донат</div>
    <div class="hub-item" id="open-auction">Аукцион</div>
  </div>
</div>

<!-- САЙТ -->
<div id="site">
  <div class="site-header">
    <div>СайтСотика</div>
    <button id="back">Назад</button>
  </div>

  <div class="site-body">
    <iframe id="frame" src="siteofsotik/index.html"></iframe>
  </div>
</div>

<script>
  // ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
  const hub = document.getElementById("hub");
  const site = document.getElementById("site");

  document.getElementById("open-site").onclick = () => {
    hub.style.display = "none";
    site.classList.add("active");
  };
  document.getElementById("back").onclick = () => {
    site.classList.remove("active");
    hub.style.display = "flex";
  };

  // ЧАТ
  const db = supabase.createClient(
    "https://xdohisilunbnfqbuglwi.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
  );

  const chatMessages = document.getElementById("chat-messages");

  function render(m) {
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `
      <div class="meta">${m.name} ${m.surname}</div>
      <div class="text">${m.text}</div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function load() {
    const { data } = await db.from("messages").select("*").order("id");
    chatMessages.innerHTML = "";
    data.forEach(render);
  }
  load();

  db.channel("msg")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => render(p.new))
    .subscribe();

  document.getElementById("chat-send").onclick = async () => {
    const name = document.getElementById("chat-name").value;
    const surname = document.getElementById("chat-surname").value;
    const text = document.getElementById("chat-msg").value;

    if (!text.trim()) return;

    await db.from("messages").insert([{ name, surname, text }]);
    document.getElementById("chat-msg").value = "";
  };
</script>

</body>
</html>
