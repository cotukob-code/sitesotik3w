<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обо мне — СайтСотика</title>
    <style>
        :root {
            --bg: #020617;
            --text: #e5e7eb;
            --accent: #38bdf8;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 32px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Обо мне</h1>
        <p>Привет! Я Сотик — стример, креатор и просто хороший человек.</p>
        <p>На этом сайте ты можешь поддержать мой контент, пообщаться в чате и узнать больше о моих проектах.</p>
        <p>Спасибо, что ты со мной!</p>
    </div>
</body>
</html>
