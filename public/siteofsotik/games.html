<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Игры — СайтСотика</title>
    <style>
        :root {
            --bg: #020617;
            --text: #e5e7eb;
            --accent: #22c55e;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 32px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .game-card {
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.4);
        }
        .game-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .game-desc {
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Игры</h1>
        <p>Вот список игр, в которые я играю и стримлю:</p>
        
        <div class="games-grid">
            <div class="game-card">
                <div class="game-title">Counter-Strike 2</div>
                <div class="game-desc">Классический шутер от первого лица</div>
            </div>
            <div class="game-card">
                <div class="game-title">Dead by Daylight</div>
                <div class="game-desc">Хоррор на выживание 4v1</div>
            </div>
            <div class="game-card">
                <div class="game-title">Minecraft</div>
                <div class="game-desc">Песочница и креатив</div>
            </div>
            <div class="game-card">
                <div class="game-title">The Sims 4</div>
                <div class="game-desc">Симулятор жизни</div>
            </div>
        </div>
    </div>
</body>
</html>
