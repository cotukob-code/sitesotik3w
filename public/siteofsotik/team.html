<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Команда — СайтСотика</title>
    <style>
        :root {
            --bg: #020617;
            --text: #e5e7eb;
            --accent: #fbbf24;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 32px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .member {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(from 210deg, #38bdf8, #22c55e, #fbbf24, #ec4899, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            color: #e5e7eb;
        }
        .name {
            font-size: 14px;
            font-weight: 600;
        }
        .role {
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Команда</h1>
        <p>Люди, которые помогают мне создавать крутой контент:</p>
        
        <div class="team-grid">
            <div class="member">
                <div class="avatar">С</div>
                <div class="name">Сотик</div>
                <div class="role">Стример</div>
            </div>
            <div class="member">
                <div class="avatar">М</div>
                <div class="name">Модер</div>
                <div class="role">Модератор</div>
            </div>
            <div class="member">
                <div class="avatar">Р</div>
                <div class="name">Редактор</div>
                <div class="role">Монтаж</div>
            </div>
            <div class="member">
                <div class="avatar">Д</div>
                <div class="name">Дизайнер</div>
                <div class="role">Графика</div>
            </div>
        </div>
    </div>
</body>
</html>
