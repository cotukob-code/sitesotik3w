<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Партнеры — СайтСотика</title>
    <style>
        :root {
            --bg: #020617;
            --text: #e5e7eb;
            --accent: #ec4899;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 32px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .partner {
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(from 210deg, #38bdf8, #22c55e, #fbbf24, #ec4899, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #e5e7eb;
        }
        .partner-name {
            font-size: 14px;
            font-weight: 600;
        }
        .partner-desc {
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Партнеры</h1>
        <p>Спасибо за поддержку и сотрудничество:</p>
        
        <div class="partners-grid">
            <div class="partner">
                <div class="logo">P</div>
                <div class="partner-name">Партнер 1</div>
                <div class="partner-desc">Стрим-платформа</div>
            </div>
            <div class="partner">
                <div class="logo">G</div>
                <div class="partner-name">Партнер 2</div>
                <div class="partner-desc">Гейм-журнал</div>
            </div>
            <div class="partner">
                <div class="logo">T</div>
                <div class="partner-name">Партнер 3</div>
                <div class="partner-desc">Технологии</div>
            </div>
            <div class="partner">
                <div class="logo">C</div>
                <div class="partner-name">Партнер 4</div>
                <div class="partner-desc">Контент</div>
            </div>
        </div>
    </div>
</body>
</html>
