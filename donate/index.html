<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Донаты — СайтСотика</title>
    <link rel="stylesheet" href="/common/style.css" />
    <style>
        header {
            padding: 40px 0;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        }
        
        .title {
            font-size: 2.5rem;
            color: var(--primary);
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
        
        main {
            padding: 40px 0;
        }
        
        .donate-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .bank-card {
            text-align: center;
            padding: 20px;
        }
        
        .bank-name {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 15px 0;
        }
        
        .phone {
            font-size: 1.1rem;
            margin: 10px 0;
        }
        
        .qr-code {
            width: 180px;
            height: 180px;
            margin: 15px auto;
            border-radius: 12px;
            background: white;
            padding: 8px;
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">ПОДДЕРЖАТЬ</h1>
            <p class="subtitle">Спасибо за вашу поддержку!</p>
        </header>

        <main>
            <h2>Способы доната</h2>
            
            <p>Вы можете поддержать проект переводом на любой из банковских счетов ниже.</p>
            
            <div class="donate-options" id="banksContainer">
                <!-- Банки будут вставлены через JavaScript -->
            </div>
        </main>

        <footer>
            <p class="text-secondary">&copy; 2026 СайтСотика. Все пожертвования добровольны.</p>
        </footer>
    </div>

    <script src="/common/banks.js"></script>
    <script>
        // Проверка режима fullscreen
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('fullscreen') === '1') {
            document.body.style.margin = '0';
            document.querySelector('.container').style.maxWidth = 'none';
            document.querySelector('.container').style.padding = '0';
        }

        // Загрузка банков
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('banksContainer');
            
            if (window.BANKS && container) {
                window.BANKS.forEach(bank => {
                    const bankElement = document.createElement('div');
                    bankElement.className = 'card bank-card';
                    bankElement.innerHTML = `
                        <h3 class="bank-name">${bank.name}</h3>
                        <div class="phone">${bank.phone}</div>
                        <img src="${bank.qrCode}" alt="QR-код ${bank.name}" class="qr-code" />
                        <p>Отсканируйте QR-код для перевода</p>
                    `;
                    container.appendChild(bankElement);
                });
            }
        });
    </script>
</body>
</html>
