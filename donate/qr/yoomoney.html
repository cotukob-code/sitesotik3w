<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR ЮMoney — Донаты</title>
    <link rel="stylesheet" href="/donate/assets/style.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .qr-fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        .qr-fullscreen img {
            max-width: 90vw;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .qr-info {
            margin-top: 20px;
            text-align: center;
            color: white;
        }
        .qr-info h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div class="qr-fullscreen">
        <a href="/donate/index.html" class="btn back-btn">Назад</a>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://yoomoney.ru/transfer" alt="QR-код ЮMoney" />
        <div class="qr-info">
            <h2>ЮMoney</h2>
            <p>+7 (926) 000-00-00</p>
        </div>
    </div>
</body>
</html>
