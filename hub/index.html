<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>СайтыСотика • Хаб</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#020617;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui;
      overflow:hidden;
    }

    /* ОБОЛОЧКА */
    .wrapper{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      padding:26px;
      gap:26px;
    }

    /* ЗАГОЛОВОК */
    .header{
      text-align:center;
      text-transform:uppercase;
      letter-spacing:0.28em;
      font-weight:900;
      font-size:32px;
      color:#fff;
      text-shadow:
        0 0 14px rgba(56,189,248,0.55),
        0 0 28px rgba(34,197,94,0.45);
    }
    .header span{
      color:#38bdf8;
    }

    /* ХАБ */
    .hub{
      flex:1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      background:
        radial-gradient(circle at 0% 0%,#38bdf822 0,transparent 60%),
        radial-gradient(circle at 100% 100%,#22c55e22 0,transparent 60%);
    }

    /* ОКНО */
    .win{
      position:relative;
      border-radius:28px;
      overflow:hidden;
      cursor:pointer;
      padding:22px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:
        linear-gradient(180deg,rgba(15,23,42,0.4),rgba(15,23,42,0.9)),
        url('https://images.unsplash.com/photo-1526401485004-2aa7c3a0f3c9?auto=format&fit=crop&w=900&q=60');
      background-size:cover;
      background-position:center;
      transition:.35s ease;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 0 0 0 rgba(56,189,248,0.0);
    }
    .win:nth-child(2){
      background:
        linear-gradient(180deg,rgba(15,23,42,0.4),rgba(15,23,42,0.9)),
        url('https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=900&q=60');
    }
    .win:nth-child(3){
      background:
        linear-gradient(180deg,rgba(15,23,42,0.4),rgba(15,23,42,0.9)),
        url('https://images.unsplash.com/photo-1509395176047-4a66953fd231?auto=format&fit=crop&w=900&q=60');
    }

    /* ХОВЕР */
    .win:hover{
      transform:translateY(-8px);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.7),
        0 0 40px rgba(56,189,248,0.35);
      border-color:rgba(56,189,248,0.6);
    }
    .win::before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 50% -20%,rgba(56,189,248,0.35),transparent 60%);
      opacity:0;
      transition:.35s;
    }
    .win:hover::before{
      opacity:1;
    }

    /* ТЕКСТ */
    .win-title{
      font-size:26px;
      font-weight:800;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:#fff;
      text-shadow:0 0 12px rgba(0,0,0,0.8);
    }
    .win-sub{
      margin-top:6px;
      font-size:13px;
      color:#cbd5e1;
      text-shadow:0 0 8px rgba(0,0,0,0.8);
    }

    /* КНОПКА */
    .win-btn{
      margin-top:14px;
      width:max-content;
      padding:8px 16px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.4);
      background:rgba(15,23,42,0.6);
      color:#fff;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.16em;
      transition:.25s;
    }
    .win:hover .win-btn{
      border-color:#38bdf8;
      color:#38bdf8;
      box-shadow:0 0 18px #38bdf855;
    }
  </style>
</head>

<body>

<div class="wrapper">

  <div class="header"><span>Сайты</span>Сотика</div>

  <div class="hub">

    <div class="win" onclick="location.href='../sitesotik/index.html'">
      <div class="win-title">СайтСотика</div>
      <div class="win-sub">Обложка • Чат • Инфо</div>
      <div class="win-btn">Открыть</div>
    </div>

    <div class="win" onclick="location.href='../donate/index.html'">
      <div class="win-title">Донаты</div>
      <div class="win-sub">Банки • Лента • Я оплатил</div>
      <div class="win-btn">Открыть</div>
    </div>

    <div class="win" onclick="location.href='../auction/index.html'">
      <div class="win-title">Аукцион</div>
      <div class="win-sub">Дом + 43 сотки • Ставки</div>
      <div class="win-btn">Открыть</div>
    </div>

  </div>

</div>

</body>
</html>
